services:
  - type: web
    name: gemini-agent-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: gemini-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gemini-agent-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: gemini-agent-db
    databaseName: gemini_agent
    user: gemini_user
    plan: free

  - name: gemini-agent-redis
    plan: free
